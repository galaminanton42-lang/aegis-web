    const di = document.getElementById('dayinfo');
    di.hidden = false;
    di.dataset.f = '1';
    di.innerHTML = (OFFNAME ? `<b>${esc(OFFNAME)}</b> · ` : '') + (S.asof ? `Данные актуальны на <b>${fmtDay(S.asof)}</b> · ` : '') + `прошло дней <b>${S.passed} из ${S.month}</b>` + (syOn() && !SY.pw ? `<br><span class="muted">${syFail ? 'нет связи с сервером, показаны последние данные' : (syTs ? 'обновлено с сервера в ' + new Date(syTs).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : 'ждём данные с сервера')}</span>` : '');
    document.getElementById('updbar').innerHTML = noteBar() + staleBar() + updBanner();
    document.getElementById('ctrl').innerHTML = (tab === 'goals' || tab === 'brand') ? scopeSeg() : '';
    document.getElementById('view').innerHTML = { goals: vGoals, brand: vBrand, det: vDet, day: vDay, hist: vHist, set: vSet }[tab]();
    document.getElementById('tabs').innerHTML = EMPTYADM ? '' : TABS.filter(t => !(LK && t[0] === 'det')).map(([k, n]) => `<button data-a="tab" data-v="${k}" ${k === tab ? 'aria-current="page"' : ''}>${ICON[k]}<span>${n}</span></button>`).join('');
}
document.addEventListener('click', ev => {
    const b = ev.target.closest('[data-a]');
    if (!b)
        return;
    const a = b.dataset.a, v = b.dataset.v;
    if (a === 'login') {
        const tn = (document.getElementById('lgTn').value || '').trim(), pin = (document.getElementById('lgPin').value || '').trim();
        if (syOn() && !SY.pw) {
            if (!tn || !pin) {
                loginMsg = 'Введите табельный номер и ПИН.';
                render();
                return;
            }
            LOGIN = { tn, pin };
            loginMsg = 'Проверяю…';
            syTs = 0;
            pull(false);
            return;
        }
        if (S.pins && String(S.pins[tn] || '') !== '' && String(S.pins[tn]) === pin && S.emps.some(e => e.tn === tn)) {
            LOGIN = { tn, pin };
            try {
                localStorage.setItem('cpu2-login', JSON.stringify(LOGIN));
            }
            catch (e) { }
            loginMsg = '';
            tab = 'goals';
        }
        else
            loginMsg = 'Неверный табельный номер или ПИН.';
        render();
        return;
    }
    if (a === 'logout') {
        LOGIN = null;
        try {
            localStorage.removeItem('cpu2-login');
        }
        catch (e) { }
        render();
        return;
    }
    if (!canEdit() && a === 'cuAdd') {
        cuMsg = 'Добавлять показатели может только администратор: введите пароль администратора в разделе синхронизации.';
        render();
        return;
    }
    if (!canEdit() && ['shift', 'delEmp', 'addEmp', 'reset', 'days', 'updClear', 'pinGen', 'pinClear', 'histClose', 'histDel', 'impGo', 'impCancel', 'staleAll', 'cuAdd', 'cuDel'].includes(a))
        return;
    if (a === 'tab') {
        tab = v;
        editOrder = false;
        window.scrollTo(0, 0);
    }
    else if (a === 'scope') {
        S.scope = v;
    }
    else if (a === 'emp') {
        openEmp = openEmp === v ? null : v;
    }
    else if (a === 'impGo') {
        if (PENDING)
            finishImport(PENDING, true);
    }
    else if (a === 'impCancel') {
        PENDING = null;
        impBox = { t: 'err', title: 'Загрузка отменена', lines: ['Текущие данные не изменились.'] };
    }
    else if (a === 'histClose') {
        const k = monthKey(), had = (S.history || []).some(h => h.k === k);
        snapMonth(k);
        histMsg = (had ? 'Итоги обновлены: ' : 'Месяц закрыт, итоги сохранены: ') + monthLabel(k) + '.';
    }
    else if (a === 'histDel') {
        if (histArm !== v) {
            histArm = v;
            render();
            return;
        }
        histArm = null;
        S.history = (S.history || []).filter(h => h.k !== v);
        histMsg = '';
    }
    else if (a === 'cuAdd') {
        const q = (document.getElementById('cuQ').value || '').trim(), by = document.getElementById('cuM').value === 'sum' ? 'sum' : 'qty';
        S.custom = S.custom || [];
        if (!q)
            cuMsg = 'Впишите, что искать, например «чехол».';
        else if (S.custom.length >= 3)
            cuMsg = 'Уже 3 показателя: удалите один.';
        else if (!S.rawG)
            cuMsg = 'Нет данных для поиска: загрузите выгрузку продаж (после обновления приложения её нужно загрузить заново один раз).';
        else if (!matchGroups({ q }).length)
            cuMsg = `По «${q}» ничего не нашёл. Я ищу по категории и названию товара в загруженной выгрузке. Проверьте написание.${(() => { const l = similarGroups(q); return l.length ? ' Похожие позиции в выгрузке: ' + l.join('; ') + '.' : ' Похожих позиций в выгрузке нет: возможно, этот товар продаётся с номером заказа не вида 12345-… (такие заказы не учитываются) или называется иначе.'; })()}`;
        else {
            const c = { id: Date.now(), n: q.charAt(0).toUpperCase() + q.slice(1), q, by };
            S.custom.push(c);
            recalcCustom();
            cuMsg = `Добавлено: «${c.n}», найдено позиций: ${c.found}. Результат на вкладке «Цели».`;
        }
    }
    else if (a === 'cuDel') {
        if (cuArm !== v) {
            cuArm = v;
            render();
            return;
        }
        cuArm = null;
        S.custom.splice(Number(v), 1);
        cuMsg = '';
    }
    else if (a === 'staleAll') {
        S.staleAll = !S.staleAll;
    }
    else if (a === 'noteOk') {
        if (NOTE)
            setSeen(NOTE);
        NOTE = 0;
    }
    else if (a === 'updSkip') {
        S.updSkip = Number(S.upd && S.upd.v);
    }
    else if (a === 'updClear') {
        delete S.upd;
    }
    else if (a === 'updCopy') {
        const t = S.upd && S.upd.url || '';
        try {
            navigator.clipboard.writeText(t).catch(() => { throw 0; });
        }
        catch (e) {
            const x = document.createElement('textarea');
            x.value = t;
            document.body.appendChild(x);
            x.select();
            try {
                document.execCommand('copy');
            }
            catch (_) { }
            x.remove();
        }
        b.textContent = 'Скопировано ✓';
        return;
    }
    else if (a === 'theme') {
        THEME = v;
        try {
            localStorage.setItem('cpu2-theme', v);
        }
        catch (e) { }
        applyTheme();
    }
    else if (a === 'delEmp') {
        if (delArm !== v) {
            delArm = v;
            render();
            return;
        }
        delArm = null;
        S.emps = S.emps.filter(e => e.tn !== v);
        if (S.me === v) {
            const f = S.emps.find(hasData) || S.emps[0];
            S.me = f ? f.tn : '';
        }
    }
    else if (a === 'addEmp') {
        const tn = (document.getElementById('addTn').value || '').trim().replace(/\s+/g, ''), h = parseFloat(String(document.getElementById('addHours').value).replace(',', '.')) || 0;
        if (!/^\d{3,}$/.test(tn))
            addMsg = 'Введите табельный номер цифрами.';
        else if (S.emps.some(e => e.tn === tn))
            addMsg = 'Сотрудник с номером ' + tn + ' уже есть в списке.';
        else if (!S.agg)
            addMsg = 'Сначала загрузите детализацию продаж: без неё искать негде.';
        else {
            const x = S.agg[tn];
            if (!x) {
                addMsg = `По номеру ${tn} в загруженной выгрузке продаж нет, сотрудник не добавлен. Проверьте номер или загрузите свежую выгрузку.`;
                render();
                return;
            }
            S.emps.push({ name: x && x.name ? x.name : 'ТН ' + tn, tn, hours: h, m: x ? x.m.slice() : Array(9).fill(0), b: x ? x.b.slice() : Array(7).fill(0), nodata: !x });
            recalcCustom();
            addMsg = x ? `Добавлен: ${x.name || tn}. ` + (h ? '' : 'Впишите ему часы ниже (раздел «Факт по сотрудникам»), иначе плана не будет.') : `Номер ${tn} добавлен, но в загруженной выгрузке продаж по нему нет. Проверьте номер или загрузите свежую выгрузку.`;
        }
    }
    else if (a === 'pinGen') {
        S.pins = S.pins || {};
        const used = new Set(Object.values(S.pins));
        for (const e of S.emps.filter(hasData))
            if (!S.pins[e.tn]) {
                let x;
                do {
                    x = String(1000 + Math.floor(Math.random() * 9000));
                } while (used.has(x));
                used.add(x);
                S.pins[e.tn] = x;
            }
    }
    else if (a === 'pinClear') {
        S.pins = {};
    }
    else if (a === 'goalEdit') {
        editOrder = !editOrder;
    }
    else if (a === 'goalReset') {
        delete S.goalOrder;
    }
    else if (a === 'shift') {
        S.shifts[v] = S.shifts[v] === false;
    }
    else if (a === 'days') {
        S.passed = Math.min(S.month, Math.max(1, S.passed + Number(v)));
    }
    else if (a === 'pull') {
        pull(false);
        return;
    }
    else if (a === 'wipeLocal') {
        if (wipeArm !== 1) { wipeArm = 1; syMsg = 'С телефона удалятся сотрудники, цели и отчёт (на сервере ничего не меняется). Нажмите «Очистить данные телефона» ещё раз для подтверждения.'; }
        else { wipeArm = 0; resetForOffice(); setOfficeTag(); PUSHOK = false; syMsg = 'Данные телефона очищены. Нажмите «Забрать данные» или загрузите отчёт этого офиса.'; save(); }
    }
    else if (a === 'push') {
        push(true);
        return;
    }
    else if (a === 'reset') {
        const hh = S.history;
        S = fresh();
        if (hh)
            S.history = hh;
        try {
            localStorage.removeItem(KEY);
            localStorage.removeItem(KEY + '-g');
        }
        catch (e) { }
    }
    save();
    if (saveErr && a === 'cuAdd')
        cuMsg += ' ⚠ Не удалось сохранить на устройстве (память переполнена): после перезапуска показатель может пропасть.';
    render();
});
document.addEventListener('change', ev => {
    const t = ev.target;
    if (t.id === 'histSel') {
        HIST.k = t.value;
        render();
        return;
    }
    if (t.id === 'histWho') {
        HIST.who = t.value;
        render();
        return;
    }
    if (t.id === 'syUrl' || t.id === 'syKey' || t.id === 'syPw') {
        SY[{ syUrl: 'url', syKey: 'key', syPw: 'pw' }[t.id]] = t.id === 'syKey' ? normKey(t.value) : t.value.trim();
        try {
            localStorage.setItem('cpu2-sync', JSON.stringify(SY));
        }
        catch (e) { }
        syMsg = '';
        return;
    }
    if (!canEdit() && t.id !== 'meSel')
        return;
    if (t.id === 'fileIn') {
        if (t.files && t.files[0])
            importFile(t.files[0]);
        return;
    }
    if (t.id === 'meSel') {
        S.me = t.value;
        save();
        render();
        return;
    }
    const p = t.dataset && t.dataset.path;
    if (!p)
        return;
    if (p.startsWith('pins.')) {
        S.pins = S.pins || {};
        const tn = p.slice(5), x = String(t.value).replace(/\D/g, '');
        if (x)
            S.pins[tn] = x;
        else
            delete S.pins[tn];
        save();
        render();
        return;
    }
    if (p.startsWith('upd.')) {
        S.upd = S.upd || {};
        const f = p.slice(4);
        S.upd[f] = f === 'v' ? (parseInt(t.value, 10) || 0) : t.value.trim();
        save();
        render();
        return;
    }
    if (p.startsWith('cu.')) {
        const [, i, f] = p.split('.'), c = (S.custom || [])[Number(i)];
        if (c) {
            if (f === 'q')
                c.q = t.value.trim();
            else if (f === 'n')
                c.n = t.value.trim();
            else if (f === 'by')
                c.by = t.value === 'sum' ? 'sum' : 'qty';
            recalcCustom();
        }
        save();
        render();
        return;
    }
    let v = parseFloat(String(t.value).replace(',', '.'));
    if (!isFinite(v) || v < 0)
        v = 0;
    if (p.startsWith('tg.')) {
        const key = p.slice(3);
        if (String(t.value).trim() === '')
            delete S.targets[key];
        else
            S.targets[key] = v / 100;
    }
    else if (p.startsWith('man.')) {
        const key = p.slice(4);
        if (String(t.value).trim() === '')
            delete S.man[key];
        else
            S.man[key] = v;
    }
    else if (p === 'targetPct')
        S.target = v / 100;
    else if (p === 'capPct')
        S.cap = Math.max(.1, v / 100);
    else if (/^t[123]p$/.test(p))
        S[p.slice(0, 2)] = v / 100;
    else if (p === 'staleDays')
        S.staleDays = Math.round(v);
    else if (p === 'month') {
        S.month = Math.max(1, Math.round(v));
        S.passed = Math.min(S.passed, S.month);
    }
    else {
        const k = p.split('.');
        let o = S;
        for (let i = 0; i < k.length - 1; i++)
            o = o[k[i]];
        o[k[k.length - 1]] = v;
    }
    save();
    render();
});
initDrag();
render();
let polling = false;
function startPoll() {
    if (polling || !syOn() || SY.pw)
        return;
    polling = true;
    setInterval(() => { if (!document.hidden)
        pull(true); }, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden)
        pull(true); });
}
if (syOn() && !SY.pw) {
    pull(true);
    startPoll();
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol))
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
</script>
